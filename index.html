function openMenu(i){category=i;renderMenu();document.getElementById('menu-dialog').showModal()}
function renderMenu(){const t=translations[lang];document.getElementById('tabs').innerHTML=t.cats.map((c,i)=>`<button class="${i===category?'selected':''}" onclick="category=${i};renderMenu()">${c}</button>`).join('');const dishIds=category===0?[0,1,2]:[category+2];document.getElementById('dishes').innerHTML=dishIds.map(i=>`<div class="dish"><div class="photo crop" style="${cropStyle(i<3?['salmon','beef','caviar'][i]:rects[category])}"></div><div><h3>${t.names[i]}</h3><p>${t.descs[i<3?i:3]}</p><strong>${i<3?`${[6,11,11][i]} zł / ${t.unit}`:t.priceRequest}</strong></div><div class="quantity">${quantities[i]?`<button onclick="changeQty(${i},-1)" aria-label="− ${t.names[i]}">−</button><span>${quantities[i]}</span>`:''}<button onclick="changeQty(${i},1)" aria-label="+ ${t.names[i]}">+</button></div></div>`).join('');const total=Object.values(quantities).reduce((a,b)=>a+b,0);document.getElementById('basket-label').textContent=total?t.count+total:t.empty;let message=t.message;Object.entries(quantities).forEach(([i,n])=>{if(n)message+='\n'+t.names[i]+' × '+n});document.getElementById('send-order').href='https://wa.me/48785377176?text='+encodeURIComponent(message)}
function changeQty(i,n){quantities[i]=Math.max(0,(quantities[i]||0)+n);renderMenu()}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));const hamburger=document.querySelector('.hamb');hamburger.addEventListener('click',()=>{const open=document.getElementById('mobile-nav').classList.toggle('open');hamburger.setAttribute('aria-expanded',String(open));hamburger.textContent=open?'×':'☰'});document.getElementById('mobile-nav').addEventListener('click',e=>{if(e.target.closest('a')){document.getElementById('mobile-nav').classList.remove('open');hamburger.setAttribute('aria-expanded','false');hamburger.textContent='☰'}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('mobile-nav').classList.remove('open');hamburger.setAttribute('aria-expanded','false');hamburger.textContent='☰'}});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));for(const [id,dir]of[['prev',-1],['next',1]])document.getElementById(id).onclick=()=>{const track=document.getElementById('gallery-track');const step=track.firstElementChild.getBoundingClientRect().width+12;if(track.scrollWidth<=track.clientWidth+2){if(dir===1)track.append(track.firstElementChild);else track.prepend(track.lastElementChild);return}if(dir===1&&track.scrollLeft>=track.scrollWidth-track.clientWidth-2)track.scrollTo({left:0,behavior:'smooth'});else track.scrollBy({left:dir*step,behavior:'smooth'})};document.getElementById('year').textContent=new Date().getFullYear();setLanguage(lang);
</script></body></html>
